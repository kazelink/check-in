name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check (JSDoc)
        run: npm run typecheck

      - name: Syntax check
        run: |
          for file in $(git ls-files 'src/*.js' 'src/**/*.js' 'public/modules/*.js' 'tests/*.js'); do
            node --check "$file"
          done
